services:
  - type: web
    name: staynest-backend
    env: node
    plan: starter
    region: oregon
    repo: https://github.com/<your-github-username>/<your-repo-name>
    branch: main
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    instanceCount: 1
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: $MONGO_URI
      - key: JWT_SECRET
        value: $JWT_SECRET
      - key: JWT_ACCESS_EXPIRES_IN
        value: $JWT_ACCESS_EXPIRES_IN
      - key: CLIENT_URL
        value: https://pennywise-expense-tracker-ten.vercel.app
      - key: FRONTEND_URL
        value: https://pennywise-expense-tracker-ten.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: $CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        value: $CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        value: $CLOUDINARY_API_SECRET
      - key: STRIPE_SECRET_KEY
        value: $STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        value: $STRIPE_WEBHOOK_SECRET
      - key: GOOGLE_CLIENT_ID
        value: $GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        value: $GOOGLE_CLIENT_SECRET
      - key: GOOGLE_CALLBACK_URL
        value: https://expense-tracker-l07o.onrender.com/api/auth/google/callback
      - key: EMAIL_HOST
        value: $EMAIL_HOST
      - key: EMAIL_PORT
        value: $EMAIL_PORT
      - key: EMAIL_USER
        value: $EMAIL_USER
      - key: EMAIL_PASS
        value: $EMAIL_PASS
      - key: ADMIN_SIGNUP_EMAILS
        value: $ADMIN_SIGNUP_EMAILS
