services:
  - type: web
    name: staynest-backend
    env: node
    plan: starter
    region: oregon
    repo: https://github.com/aditya42202/StayNest.git
    branch: main
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    instanceCount: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: $MONGO_URI
      - key: JWT_SECRET
        value: $JWT_SECRET
      - key: JWT_ACCESS_EXPIRES_IN
        value: $JWT_ACCESS_EXPIRES_IN
      - key: CLIENT_URL
        value: https://stay-nest-eight.vercel.app
      - key: FRONTEND_URL
        value: https://stay-nest-eight.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://stay-nest-eight.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        value: $CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        value: $CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        value: $CLOUDINARY_API_SECRET
      - key: STRIPE_SECRET_KEY
        value: $STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        value: $STRIPE_WEBHOOK_SECRET
      - key: GOOGLE_CLIENT_ID
        value: $GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        value: $GOOGLE_CLIENT_SECRET
      - key: GOOGLE_CALLBACK_URL
        value: https://staynest-1-ihrf.onrender.com/api/auth/google/callback
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_VERIFICATION_TOKEN_TTL_MINUTES
        value: "30"
      - key: EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: ADMIN_SIGNUP_EMAILS
        value: $ADMIN_SIGNUP_EMAILS
